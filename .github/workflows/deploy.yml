name: Build & Deploy Portfolio

on:
  push:
    branches: [release/production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_PORT: 3000

jobs:
  build-and-deploy:
    name: Build image and deploy to server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ── 1. Source code ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Normalise image name (GHCR requires lowercase) ────────────────────
      - name: Set lowercase image name
        id: image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      # ── 3. Authenticate to GHCR ───────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Build and push Docker image ────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest

      # ── 5. Deploy on the remote Ubuntu server ─────────────────────────────────
      #   Required repository/environment secrets:
      #     SSH_HOST         — server IP or hostname
      #     SSH_USER         — SSH login user
      #     SSH_PRIVATE_KEY  — private key (RSA/ED25519)
      #     SSH_PORT         — SSH port (omit to default to 22)
      #     APP_PORT         — host port to map container port 80 onto
      #     GHCR_PAT         — GitHub PAT with read:packages scope for pulling images
      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.name }}:latest
          CONTAINER: vannal-sok-portfolio
          APP_PORT: ${{ github.event.inputs.APP_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,CONTAINER,APP_PORT
          script: |
            set -e

            # Authenticate to GHCR so Docker can pull the image
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull the freshly built image
            docker pull "$IMAGE"

            # Stop and remove any existing container with the same name
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm   "$CONTAINER" 2>/dev/null || true

            # Run the new container
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p "$APP_PORT":80 \
              "$IMAGE"

            # Clean up dangling images to save disk space
            docker image prune -f
