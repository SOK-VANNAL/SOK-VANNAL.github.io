server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Redirect /Vannal-SOK -> /Vannal-SOK/ so relative asset paths resolve correctly
    location = /Vannal-SOK {
        return 301 /Vannal-SOK/;
    }

    # Serve the portfolio under the /Vannal-SOK/ subpath
    location /Vannal-SOK/ {
        alias /usr/share/nginx/html/;
        index index.html;

        # Cache static assets (no nested alias - inherit from parent)
        location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Fallback for HTML routes
        try_files $uri $uri/ /index.html;
    }

    # Simple health endpoint
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
